[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tools"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["tools"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
