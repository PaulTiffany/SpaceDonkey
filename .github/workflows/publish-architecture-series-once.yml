name: Publish SpaceDonkey architecture series once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-architecture-series-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish architecture series to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          tmp="$(mktemp -d)"
          git clone "$remote" "$tmp/wiki"
          cd "$tmp/wiki"

          cat > Architecture.md <<'EOF'
          # Architecture

          SpaceDonkey is a **distributed momentum-exchange transport network** built around an equatorial planetary backbone.

          The payload does not ride one elevator, one tether, or one vehicle all the way to orbit. It moves through a sequence of locally achievable states:

          **approach → capture → powered ride → timed release → free flight → next capture**

          Repeat until the final release state is orbital.

          The proposal deliberately separates two questions that are often fused together:

          1. **How is a planetary ring or ring-station backbone supported?**
          2. **What should we do with that backbone once we have it?**

          SpaceDonkey is primarily about the second question. Ring stations, orbital rings, skyhooks, electromagnetic launch systems, motors, guidance, regenerative braking, and active control all have prior art. We should borrow them aggressively.

          > **Borrow everything we can. Throw out the parts that are not true.**

          ## Architecture invariant

          A hard global transition should be decomposed into enough bounded local transitions that the payload retains useful next moves.

          We therefore optimize for **grace**, not merely maximum throw.

          A good stage does not place the payload on one perfect trajectory. It places the payload inside a region from which several useful continuations remain reachable.

          ## System layers

          ```text
          EARTH
            │
            │ optional torque / centering / power coupling
            ▼
          EQUATORIAL BACKBONE
            │
            ├── Ring Station A ── Donkey A1 / A2 / ...
            ├── Ring Station B ── Donkey B1 / B2 / ...
            ├── Ring Station C ── Donkey C1 / C2 / ...
            └── ...

          PAYLOAD ROUTE

          first capture
               ↓
          Donkey → free flight → Donkey → free flight → Donkey → ... → orbit
          ```

          The backbone carries structure, timing, power, and reaction loads. The Donkeys perform local momentum exchange. Free flight connects stages. Earth may serve as the ultimate momentum reservoir without being required to carry the ring's full structural weight.

          ## Architecture pages

          - [[Architecture - Backbone Contract|Architecture-Backbone-Contract]]
          - [[Architecture - Ring Stations|Architecture-Ring-Stations]]
          - [[Architecture - Earth Coupling|Architecture-Earth-Coupling]]
          - [[Architecture - Donkey Stage|Architecture-Donkey-Stage]]
          - [[Architecture - Capture and Release|Architecture-Capture-and-Release]]
          - [[Architecture - Free Flight and Routing|Architecture-Free-Flight-and-Routing]]
          - [[Architecture - Power and Energy|Architecture-Power-and-Energy]]
          - [[Architecture - Angular Momentum|Architecture-Angular-Momentum]]
          - [[Architecture - Control and Timing|Architecture-Control-and-Timing]]
          - [[Architecture - Atmosphere and Terminals|Architecture-Atmosphere-and-Terminals]]
          - [[Architecture - Failure and Recovery|Architecture-Failure-and-Recovery]]
          - [[Architecture - Construction and Growth|Architecture-Construction-and-Growth]]
          - [[Architecture - Borrowed Technology|Architecture-Borrowed-Technology]]
          - [[Architecture - Kill Criteria|Architecture-Kill-Criteria]]

          ## What is deliberately not frozen

          The architecture does **not** yet require one final answer for:

          - passive compression ring versus dynamically supported orbital ring;
          - anchored versus free-centered backbone;
          - rigid arm versus tether versus translated capture carriage;
          - exact stage count;
          - exact ring altitude;
          - exact first-stage launch method;
          - exact momentum-return mechanism.

          Those are implementation choices and kill tests, not dogma.

          What is frozen enough to test is the **interface** between them: a stable planetary backbone supplies powered momentum-exchange stages whose reachable-state envelopes overlap enough to form a robust route to orbit.

          See also [[The Idea]], [[Prior Art|Prior-Art]], and [[Kill Tests|Kill-Tests]].
          EOF

          cat > Architecture-Backbone-Contract.md <<'EOF'
          # Architecture - Backbone Contract

          The Donkey network should not care *why* the ring stays up. It should care what the backbone can reliably provide.

          This is the **backbone contract**.

          Any ring or ring-station technology is acceptable if it satisfies the contract well enough.

          ## Required services

          ### 1. Known geometry

          Each station must have a predictable pose relative to Earth and the other stations. The route planner needs to know where capture opportunities will exist and when.

          ### 2. Reaction loads

          A powered Donkey pushes on the payload and therefore pushes back on its support. The backbone must carry those transient forces and torques without unacceptable motion, fatigue, or instability.

          ### 3. Power

          Stations need electrical power for motors, capture hardware, sensors, computation, thermal control, communications, and recharging between transfers.

          ### 4. Time

          Capture windows are phase-sensitive. The network requires a shared timing reference and bounded clock/position error.

          ### 5. Momentum path

          Payload momentum does not come from nowhere. The backbone must either absorb the reaction temporarily or provide a path to a larger reservoir such as Earth, inbound traffic, reaction mass, or another momentum-management system.

          ### 6. Fault containment

          A failed Donkey, station, or local ring segment must not automatically propagate into global loss of the network.

          ## Candidate backbone families

          We should borrow whichever survives analysis:

          - self-supporting or actively stabilized compression hoop;
          - Birch-style dynamically supported orbital ring / ring stations;
          - hybrid ring with sparse Earth coupling;
          - tension/compression hybrids;
          - future structures that satisfy the same interface better.

          SpaceDonkey should not become emotionally attached to any one of them.

          ## The important abstraction

          ```text
          BACKBONE IMPLEMENTATION
                   │
                   ▼
          ┌──────────────────────┐
          │  Backbone Contract   │
          │ geometry             │
          │ loads                │
          │ power                │
          │ timing               │
          │ momentum path        │
          │ fault containment    │
          └──────────────────────┘
                   │
                   ▼
             DONKEY NETWORK
          ```

          If the compression-ring hypothesis dies but a dynamically supported ring satisfies the contract, the transport architecture survives.

          That is intentional.

          Related: [[The Ring|The-Ring]], [[Architecture - Ring Stations|Architecture-Ring-Stations]].
          EOF

          cat > Architecture-Ring-Stations.md <<'EOF'
          # Architecture - Ring Stations

          The backbone becomes useful through **ring stations**: distributed nodes that host Donkeys and local infrastructure.

          A station is not merely a place on a ring. It is a controlled mechanical and electrical interface between the global backbone and local momentum exchange.

          ## Station functions

          A mature station may provide:

          - one or more Donkey pivots or carriage tracks;
          - local energy storage;
          - motor drives and regenerative braking;
          - structural load spreading into the backbone;
          - precision state estimation;
          - capture sensors and communications;
          - thermal management;
          - local maintenance access;
          - traffic coordination;
          - emergency safeing.

          ## Stations need not be identical

          SpaceDonkey probably wants **heterogeneous stations**.

          Lower stations may favor long, slow, forgiving transfers. Middle stations may maximize reachable-state overlap. Upper stations may prioritize precision, high tip speed, and orbital insertion.

          The network should therefore be optimized as a system rather than built from one repeated ideal Donkey.

          ## Load locality

          A central architectural goal is to keep violent dynamics local.

          The payload experiences a strong but bounded acceleration at one Donkey. The station spreads the reaction load into the backbone. The global structure should see filtered, distributed loads rather than one planet-sized synchronous jerk.

          ## Station spacing

          Uniform spacing is not required.

          Stations should be placed where they create useful overlaps in reachable state space. Dense clusters may exist near difficult transition regions; sparse regions may be sufficient where free-flight corridors are broad.

          The correct question is not "how many stations per degree of longitude?"

          It is:

          > **Where does another station materially enlarge the set of recoverable routes?**

          Related: [[Architecture - Free Flight and Routing|Architecture-Free-Flight-and-Routing]], [[Architecture - Control and Timing|Architecture-Control-and-Timing]].
          EOF

          cat > Architecture-Earth-Coupling.md <<'EOF'
          # Architecture - Earth Coupling

          SpaceDonkey distinguishes **support** from **coupling**.

          An Earth connection may be valuable even if it does not hold the ring's weight.

          ## Possible jobs for an anchor or coupling station

          ### Centering

          Keep the backbone correctly located relative to Earth's center and equatorial plane.

          ### Phase control

          Maintain the intended relationship between ring stations and ground longitude.

          ### Torque exchange

          Return angular momentum between the backbone and Earth after outbound or inbound transfers.

          ### Power

          Supply electrical energy from terrestrial generation, at least during early deployment.

          ### Damping

          Remove low-frequency oscillations, drift, and unwanted global modes.

          ### Maintenance and access

          Provide physical interfaces for construction, inspection, replacement, and emergency operations.

          ## What an anchor does not automatically mean

          A sparse tether, electromagnetic coupler, or control station does **not** necessarily mean the ground is carrying the ring's full effective weight.

          This distinction matters.

          > **An anchor may locate and torque the ring without structurally supporting the ring.**

          If analysis later shows that substantial vertical support is unavoidable, then that becomes part of the chosen backbone implementation. But SpaceDonkey should not smuggle it in as an assumption.

          ## Earth as momentum reservoir

          For prograde launches, payload angular momentum must come from somewhere. One elegant closure path is:

          ```text
          Earth → coupling → backbone → Donkey → payload
          ```

          The corresponding change in Earth's rotation would be tiny for ordinary launch traffic, but the accounting remains physically explicit.

          Related: [[Architecture - Angular Momentum|Architecture-Angular-Momentum]].
          EOF

          cat > Architecture-Donkey-Stage.md <<'EOF'
          # Architecture - Donkey Stage

          A **Donkey** is one powered momentum-exchange stage attached to a ring station.

          It may ultimately be implemented as a rotating tether, rigid arm, reeling tether, translated carriage, articulated mechanism, or some hybrid. The implementation can change while the stage contract remains the same.

          ## Stage contract

          A Donkey must:

          1. present a capture interface on a predictable trajectory;
          2. acquire a payload with bounded relative position and velocity error;
          3. transfer energy and momentum during a finite ride;
          4. release at a controlled state;
          5. recover mechanically and energetically for another cycle.

          ## The important geometry

          For an ideal rotating tip of radius `r` and speed `v`, centripetal acceleration is

          $$a_c = \frac{v^2}{r}.$$

          For a desired tip speed, increasing stage length can reduce angular rate and acceleration. That may buy **grace**: longer interaction time, broader timing windows, and lower peak loads.

          This does not mean "longer is always better." Long tethers add mass, flexibility, drag, collision area, and control complexity.

          ## Powered, not merely passive

          The Donkeys are not restricted to passive momentum exchange. Motors can add or remove energy during the ride.

          This turns each stage into a reusable electromechanical accelerator whose reaction load closes through the station and backbone.

          ## Stage diversity

          A likely architecture uses different Donkey families for different regimes:

          - lower: slower, longer, forgiving;
          - middle: transfer and recovery optimized;
          - upper: faster, more precise, orbital-state optimized;
          - terminal: final insertion or handoff to another orbital system.

          Related: [[The Donkeys|The-Donkeys]], [[Architecture - Capture and Release|Architecture-Capture-and-Release]].
          EOF

          cat > Architecture-Capture-and-Release.md <<'EOF'
          # Architecture - Capture and Release

          Capture should be a **merge, not a jump**.

          The Donkey meets the payload on a trajectory that already makes their relative state small. Guidance then removes residual error, and a mechanical interface carries the real transfer load.

          ## Nominal sequence

          **approach → electromagnetic/active guidance → acquire → mechanical lock → powered ride → timed unlock → separation**

          ## Relative-energy constraint

          If payload and capture device have relative velocity `Δv`, the relative kinetic energy is

          $$E_{rel}=\frac12 m |\Delta v|^2.$$

          That quadratic is unforgiving.

          Magnets, robotics, and clever control cannot turn a wildly mismatched intercept into a gentle capture. The route geometry must first make `Δv` small.

          > **The swing does the acceleration. The magnet does the forgiveness.**

          ## Capture corridor

          A stage has a set of states from which capture is physically acceptable:

          $$\mathcal C_i = \{(\mathbf r,\mathbf v,t): \|\Delta\mathbf r\|\le r_{max},\; \|\Delta\mathbf v\|\le v_{max},\; \text{load limits satisfied}\}.$$

          The network is viable only if useful free-flight trajectories repeatedly intersect these corridors with margin.

          ## Release is equally important

          The goal is not merely to fling the payload fast. Release must place it inside a useful **outgoing reachable set**.

          Timing, direction, structural recoil, payload attitude, and next-stage geometry all matter.

          A good release leaves options.

          Related: [[Architecture - Free Flight and Routing|Architecture-Free-Flight-and-Routing]], [[Grace and State Space|Grace-and-State-Space]].
          EOF

          cat > Architecture-Free-Flight-and-Routing.md <<'EOF'
          # Architecture - Free Flight and Routing

          Free flight is not dead time between machines. It is a first-class part of the architecture.

          After release, the payload follows a ballistic or lightly controlled trajectory until another capture opportunity becomes reachable.

          ## State-space staircase

          A minimal payload state is

          $$S=(\mathbf r,\mathbf v,t).$$

          A route is a sequence

          $$S_0 \xrightarrow{D_1} S_1 \xrightarrow{flight} S_2 \xrightarrow{D_2} \cdots \xrightarrow{D_N} S_{orbit}.$$

          Altitude need not increase monotonically.

          A payload may rise, coast, fall, dive, or change direction if doing so improves the next rendezvous.

          We are climbing through **reachable position-velocity-time states**, not floors of a tower.

          ## Network, not ladder

          The intended mature system is not necessarily:

          `D1 → D2 → D3 → D4`.

          It should look more like a graph:

          ```text
                 D4 ─── D7
                /  \   /  \
          D1 ─ D2   D5    D9 → orbit
                \  /   \  /
                 D3 ─── D8
          ```

          A missed capture may therefore become a reroute rather than a mission loss.

          ## Grace as overlap

          For stage `i`, let `R_i` be its release reachable set and `C_j` the capture set of a later stage.

          Useful routing requires substantial intersections:

          $$R_i \cap C_j \neq \varnothing.$$

          The stronger design objective is not mere non-empty intersection but **large, robust overlap under uncertainty**.

          That is the core reason to investigate high stage count.

          Related: [[Grace and State Space|Grace-and-State-Space]].
          EOF

          cat > Architecture-Power-and-Energy.md <<'EOF'
          # Architecture - Power and Energy

          SpaceDonkey moves much of the propulsion machinery off the payload and into reusable infrastructure.

          That is the energy architecture.

          ## Energy path

          ```text
          generation / storage
                  ↓
              backbone
                  ↓
             ring station
                  ↓
             Donkey motor
                  ↓
               payload
          ```

          During capture or deceleration, the arrows may partially reverse through regenerative systems.

          ## Why external machinery matters

          A rocket must carry much of the machinery and reaction mass used to accelerate itself. SpaceDonkey asks whether stationary or repeatedly reusable external machinery can perform many of those transfers instead.

          This does **not** remove the orbital energy requirement.

          For circular orbit at radius `R`, specific orbital energy remains

          $$\epsilon=-\frac{\mu}{2R}.$$

          The infrastructure only changes **how the required energy is delivered**.

          ## Three efficiencies

          We should keep three different questions separate:

          1. **transfer efficiency** — electrical/mechanical energy reaching the payload;
          2. **recharge efficiency** — recovering and restoring Donkey state;
          3. **system efficiency** — including ring maintenance, drag, thermal control, station losses, and downtime.

          A beautiful transfer efficiency can still hide a terrible full system.

          ## Power versus energy

          Many stages may lower instantaneous demand per stage while increasing total infrastructure. Recharge can occur slowly between payloads if traffic is low, or continuously across many distributed stations at high throughput.

          The key architectural advantage is that peak payload power does not have to be generated onboard.

          Related: [[Energy and Angular Momentum|Energy-and-Angular-Momentum]].
          EOF

          cat > Architecture-Angular-Momentum.md <<'EOF'
          # Architecture - Angular Momentum

          Energy can be supplied electrically. Angular momentum still has to balance.

          This is one of the architecture's non-negotiable ledgers.

          For a payload of mass `m`, specific angular momentum is approximately

          $$h = |\mathbf r \times \mathbf v|.$$

          For circular orbit,

          $$h_{orbit}=\sqrt{\mu R}.$$

          A payload leaving Earth's surface already carries some prograde angular momentum from Earth's rotation, but orbital insertion requires much more.

          ## Local transfer

          When a Donkey gives the payload prograde angular momentum,

          $$\Delta L_{payload} = -\Delta L_{Donkey+backbone}$$

          unless another reservoir participates during the interaction.

          A massive backbone may absorb small impulses temporarily. It cannot absorb unlimited outbound traffic without changing state.

          ## Momentum-management options

          The architecture can borrow or combine:

          - Earth torque coupling;
          - inbound payloads and regenerative return traffic;
          - counter-rotating machinery;
          - reaction mass where appropriate;
          - electrodynamic coupling;
          - external orbital momentum reservoirs.

          The final design must close this ledger quantitatively.

          ## Preferred conceptual closure

          A sparse Earth-coupled backbone gives a simple system-level path:

          **Earth → backbone → Donkey → payload**

          Earth is an enormous angular-momentum reservoir. That makes it attractive, not magical: torque, stresses, coupling hardware, and power flow still need engineering.

          Related: [[Architecture - Earth Coupling|Architecture-Earth-Coupling]], [[Energy and Angular Momentum|Energy-and-Angular-Momentum]].
          EOF

          cat > Architecture-Control-and-Timing.md <<'EOF'
          # Architecture - Control and Timing

          SpaceDonkey should be controlled hierarchically.

          No single fast controller needs to command the entire planet-sized machine at servo frequency.

          ## Control layers

          ### Global backbone control

          Slow dynamics: ring centering, global modes, phase relative to Earth, thermal expansion, momentum balance, traffic allocation.

          ### Station control

          Local structural state, energy storage, Donkey scheduling, neighboring-station coordination, fault isolation.

          ### Donkey servo control

          Fast dynamics: motor torque, tether/arm state, capture carriage trajectory, release timing, local vibration suppression.

          ### Payload guidance

          State estimation, approach correction, attitude, capture handshake, post-release navigation.

          ## Shared timing

          The network is fundamentally phase-sensitive. Every useful capture is a rendezvous between moving objects.

          Therefore timing error must be treated as a physical state variable, not merely a software detail.

          ## Predict, then correct locally

          Long-horizon route planning should predict a capture corridor. Local sensing should close the final error.

          The intended pattern is:

          **global prediction → local acquisition → mechanical certainty**.

          ## Authority boundaries

          A local Donkey controller may reject an unsafe capture even if a global route planner requested it. A station may safe its hardware without permission from a planetary optimizer.

          This is both a reliability feature and an alignment feature: recursive capability should not silently acquire recursive authority.

          Related: [[Architecture - Failure and Recovery|Architecture-Failure-and-Recovery]].
          EOF

          cat > Architecture-Atmosphere-and-Terminals.md <<'EOF'
          # Architecture - Atmosphere and Terminals

          The hardest part of SpaceDonkey may be where space is not yet space.

          Long, fast-moving hardware in dense atmosphere experiences drag, heating, weather, corrosion, acoustic loading, and traffic hazards. The architecture should not assume that a beautiful vacuum tether remains beautiful at 10 km altitude.

          ## Lower terminal options

          The first capture may be reached by:

          - conventional rocket or reusable first stage;
          - aircraft or air-breathing accelerator;
          - electromagnetic ground launch;
          - balloon/high-altitude platform;
          - a specialized low-altitude Donkey if analysis permits;
          - another launch-loop or tether technology.

          SpaceDonkey does not require ideological purity about the first kilometer.

          ## First capture requirement

          Whatever delivers the payload must place it inside the first useful capture corridor with acceptable relative velocity and timing error.

          That interface is more important than the brand name of the launch method.

          ## Upper terminal

          Likewise, the final Donkey need not inject directly into every destination orbit.

          It may release into:

          - stable low Earth orbit;
          - an elliptical transfer orbit;
          - a rendezvous with another orbital transport layer;
          - a depot or tug architecture.

          The Donkey network is an Earth-to-orbital-state machine, not necessarily the entire Solar System logistics stack.

          ## Atmospheric kill condition

          If all useful low-stage geometries incur unacceptable drag, heating, or safety burden, the ring network should simply begin higher and borrow a different first-stage system.

          Related: [[Architecture - Borrowed Technology|Architecture-Borrowed-Technology]].
          EOF

          cat > Architecture-Failure-and-Recovery.md <<'EOF'
          # Architecture - Failure and Recovery

          A thousand-stage architecture is useless if one missed stage means death.

          Reliability must come from **routes and recovery**, not only from making every component perfect.

          ## Failure classes

          ### Capture miss

          Payload passes outside the capture corridor or the stage rejects acquisition.

          Preferred response: continue on a known safe free-flight trajectory and target another reachable stage or terminal.

          ### Donkey unavailable

          Motor, tether, capture mechanism, or local controller is offline.

          Preferred response: route planner removes its reachable edges from the graph.

          ### Station fault

          Local structure, timing, power, or thermal system degraded.

          Preferred response: isolate station and widen exclusion region.

          ### Backbone disturbance

          Global geometry or timing departs from safe bounds.

          Preferred response: stop captures, park Donkeys, recover backbone before resuming traffic.

          ## Reliability scaling

          If a route required `N` compulsory stages with independent success probability `p`, naive mission success would scale like

          $$P = p^N.$$

          That is exactly why a high-stage-count architecture must **not** behave like a brittle serial chain.

          The network needs alternate edges, skipped stages, recapture opportunities, and safe terminal states.

          ## Fail safe, not merely fail operational

          A Donkey should default to a state that does not sweep unexpectedly through traffic. Capture should require positive agreement. Loss of coordination should reduce authority rather than increase it.

          Related: [[Kill Tests|Kill-Tests]], [[Architecture - Free Flight and Routing|Architecture-Free-Flight-and-Routing]].
          EOF

          cat > Architecture-Construction-and-Growth.md <<'EOF'
          # Architecture - Construction and Growth

          SpaceDonkey is only interesting if it admits a path from experiments to infrastructure.

          The final planet-scale form may require a closed ring, but the **transport mechanisms can be validated long before that ring exists**.

          ## Development sequence

          ### One Donkey

          Demonstrate capture, powered ride, controlled release, structural reaction, and energy recovery with realistic errors.

          ### Two Donkeys

          Demonstrate reachable-set overlap and actual recapture after free flight.

          ### Small network

          Demonstrate routing, skipped stages, failure recovery, and traffic scheduling.

          ### Ring-station test article

          Couple multiple Donkeys to a common structural/power backbone and measure cross-coupled dynamics.

          ### Backbone demonstrator

          Test the chosen ring-support technology independently against its own structural kill criteria.

          ### Integrated orbital segment

          Operate a limited set of real momentum-exchange stations in the relevant environment.

          ### Planetary buildout

          Only after local mechanisms and backbone physics survive should a continuous equatorial system be considered.

          ## Bootstrap principle

          Do not require the final machine to prove the first mechanism.

          Every stage of development should produce a useful physical result that can falsify the next assumption.

          ## Incremental value

          Intermediate infrastructure may still be useful for high-altitude transport, orbital servicing, momentum exchange, power distribution, or experiments even before a complete Earth-to-orbit route exists.

          That matters economically: a megastructure with zero value until the last bolt is installed is much harder to build.

          Related: [[Research Roadmap|Research-Roadmap]].
          EOF

          cat > Architecture-Borrowed-Technology.md <<'EOF'
          # Architecture - Borrowed Technology

          SpaceDonkey is not a purity project.

          We should steal every lawful, physically demonstrated advantage from prior engineering and discard inherited assumptions that do not survive our architecture.

          ## Technology families to borrow

          ### Planetary and orbital rings

          Ring stations, moving-mass orbital rings, active stabilization, distributed structures, and their literature on global modes and construction.

          ### Momentum-exchange tethers

          Skyhooks, MXER, HASTOL, motorized tethers, tether deployment and capture timing.

          ### Electromagnetic machinery

          Maglev bearings, linear motors, magnetic capture/guidance, high-power drives, regenerative braking.

          ### Space power

          Solar, nuclear, storage, power beaming where justified, high-voltage distribution, thermal rejection.

          ### Guidance and autonomy

          Precision navigation, distributed state estimation, collision avoidance, fault detection, trajectory optimization.

          ### Materials and structures

          High-specific-strength fibers, composites, compression members, active structures, vibration control, robotic inspection.

          ## What borrowing does not mean

          Prior art is evidence that a component or idea has been studied. It is not proof that every assumption around it is correct.

          For every borrowed subsystem ask:

          1. What capability does it actually demonstrate?
          2. What assumptions did its original architecture require?
          3. Which of those assumptions remain necessary here?
          4. What measurements would prove the borrowed claim wrong?

          ## Examples

          A Birch ring may teach us useful ring-station mechanics without forcing us to inherit the exact Birch support architecture.

          HASTOL may teach us rendezvous and tether dynamics without forcing us to use one enormous throw.

          MXER may teach us how narrow capture windows become, motivating the opposite design pressure: **more stages to buy more grace**.

          The inheritance rule is simple:

          > **Take the capability. Re-test the premise.**

          Related: [[Prior Art|Prior-Art]].
          EOF

          cat > Architecture-Kill-Criteria.md <<'EOF'
          # Architecture - Kill Criteria

          The architecture should be able to die cleanly.

          These are the principal ways to kill it.

          ## Backbone dies

          No plausible ring/ring-station implementation can satisfy the backbone contract at useful mass, stability, cost, or safety.

          ## Donkey dies

          A powered stage cannot capture, accelerate, and release realistic payloads within acceptable structural loads and timing margins.

          ## Grace hypothesis dies

          Increasing stage count fails to enlarge robust reachable-state overlap enough to compensate for added hardware and coordination burden.

          ## Reliability dies

          Even with alternate routes, the probability and consequence of stage failures scale worse than competing transport architectures.

          ## Atmosphere dies

          There is no viable transition from atmospheric flight to the first useful momentum-exchange stage.

          ## Momentum ledger dies

          No practical method closes the repeated angular-momentum transfer required for sustained traffic.

          ## Power dies

          Recharge throughput, storage mass, thermal rejection, or transmission losses overwhelm the transport advantage.

          ## Dynamics die

          Donkey impulses, ring modes, tether oscillations, centering requirements, or coupled control create unavoidable instability.

          ## Traffic dies

          Debris, collision risk, exclusion zones, or synchronization constraints prevent useful throughput.

          ## Bootstrap dies

          The system requires a final-scale planetary investment before any smaller configuration can validate or create value.

          ## The strongest falsifier

          The core SpaceDonkey proposition is not "rings are possible" or "tethers work."

          It is:

          > **Many bounded momentum exchanges create a more graceful and recoverable route to orbit than a small number of heroic exchanges.**

          If simulation and experiment show that more Donkeys do not buy that grace, SpaceDonkey has lost its reason to exist.

          Related: [[Kill Tests|Kill-Tests]].
          EOF

