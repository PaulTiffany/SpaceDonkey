name: Add prior-art citations to SpaceDonkey architecture once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cite-architecture-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Cite architecture prior art in GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          tmp="$(mktemp -d)"
          git clone "$remote" "$tmp/wiki"
          cd "$tmp/wiki"

          python - <<'PY'
          from pathlib import Path

          marker = "<!-- prior-art-citations-v1 -->"

          additions = {
              "Architecture.md": r'''
          ## Prior-art anchors
          <!-- prior-art-citations-v1 -->

          The architecture deliberately starts from mechanisms that already have substantial prior art rather than claiming the whole stack as new.

          - **Planetary rings and ring stations:** Paul Birch's 1982 *Orbital Ring Systems and Jacob's Ladders — I* develops low-orbit rings carrying electromagnetically supported, Earth-stationary skyhooks and hanging ladders. [Birch 1982](https://nss.org/wp-content/uploads/Orbital-Rings.pdf)
          - **Atmospheric rendezvous with a rotating tether:** Boeing/Tethers Unlimited's NIAC HASTOL study models a hypersonic vehicle meeting a rotating tether tip whose velocity is matched near rendezvous. [HASTOL Phase II Final Report, 2001](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)
          - **Reusable momentum-exchange tether and precision capture:** NASA's MXER work studies reusable rotating tethers, catch/release mechanisms, electrodynamic reboost, and capture windows on the order of seconds. [MXER design concept](https://ntrs.nasa.gov/citations/20060005548) · [MXER simulation study](https://ntrs.nasa.gov/citations/20060051892)
          - **Ring plus rotating sling:** Meulenberg and Poston's *Sling-on-a-Ring* explicitly combines an equatorial orbital ring with rotating sling modules. [Physics Procedia 20 (2011), 222–231](https://doi.org/10.1016/j.phpro.2011.08.021)
          - **Multiple sequential rotating tethers:** Kazanskii's 2026 *Space-Clock Elevator* studies payload transfer through multiple synchronized rotating tethers and intermediate free-flight nodes. [arXiv:2604.11221](https://arxiv.org/abs/2604.11221)

          SpaceDonkey's narrower architectural bet is therefore **not** "rings" or "rotating tethers" in isolation. It is whether a very high-stage-count network of independently powered momentum-exchange stages can trade maximum throw for **grace, overlap, alternate routing, and recovery**.
          ''',

              "Architecture-Ring-Stations.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Ring stations are not a SpaceDonkey invention. Birch's orbital-ring work explicitly separates a fast orbital ring from electromagnetically supported skyhooks that can hold station relative to Earth and support hanging infrastructure. [Birch 1982](https://nss.org/wp-content/uploads/Orbital-Rings.pdf)

          Meulenberg and Poston later proposed an equatorial ring carrying rotating sling modules, solar power, and station-keeping hardware. [Sling-on-a-Ring, 2011](https://doi.org/10.1016/j.phpro.2011.08.021) Their related LEO Archipelago work treats circumterrestrial rings as reusable infrastructure for communications, transport, and power. [LEO Archipelago](https://arxiv.org/abs/1009.4043)

          SpaceDonkey borrows the **station as reusable infrastructure node** and then asks whether many heterogeneous stations can be arranged for reachable-state overlap rather than one/few heroic transfers.
          ''',

              "Architecture-Earth-Coupling.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Existing tether literature already separates momentum exchange from momentum restoration. NASA's MXER concept throws a payload by giving up facility orbital energy/momentum, then proposes electrodynamic reboost by coupling a conducting tether to Earth's magnetic field. [NASA MXER design concept](https://ntrs.nasa.gov/citations/20060005548) Earlier MXER modeling describes the facility as a momentum wheel that can rebuild its state between payload transfers. [NASA momentum-exchange model](https://ntrs.nasa.gov/citations/20020046691)

          HASTOL likewise incorporated a conducting tether element intended to restore boost-facility momentum through electrodynamic force. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          SpaceDonkey keeps this bookkeeping explicit while leaving the final Earth-coupling mechanism open: mechanical anchoring, electromagnetic coupling, electrodynamic tethering, inbound regenerative traffic, or another physically closed path may win.
          ''',

              "Architecture-Donkey-Stage.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          The basic momentum-exchange stage has deep prior art. HASTOL studied a rotating orbital tether whose tip matches an incoming hypersonic payload near rendezvous, captures it, rotates it upward, and releases it into a higher-energy trajectory. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          NASA's MXER program developed the same family of reusable rotating-tether ideas further, including survivable tether materials, catch/release mechanisms, high-accuracy propagation, and electrodynamic reboost. [MXER status, 2006](https://ntrs.nasa.gov/citations/20060047739) [MXER design concept](https://ntrs.nasa.gov/citations/20060005548)

          *Sling-on-a-Ring* combines rotating sling modules directly with a circumterrestrial ring. [Meulenberg & Poston 2011](https://doi.org/10.1016/j.phpro.2011.08.021)

          The SpaceDonkey difference is architectural: **many powered stages, deliberately unequal, arranged as a recoverable network rather than one/few maximum-performance throws.**
          ''',

              "Architecture-Capture-and-Release.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Capture is already recognized as a central difficulty in rotating-tether systems. The HASTOL team treated rendezvous and grapple engagement as key technical issues requiring detailed simulation. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          NASA's MXER design work specifically calls out reliable, lightweight catch/release mechanisms and tolerance to position and velocity error as development requirements. [MXER design concept](https://ntrs.nasa.gov/citations/20060005548) A later MXER dynamics study describes a roughly 100 km tether spinning with a 6–7 minute period and a payload-capture window of only a few seconds, with position prediction on the order of a meter. [MXER Simulation Study](https://ntrs.nasa.gov/citations/20060051892)

          Those results are exactly why SpaceDonkey treats **grace** as a first-class architectural variable rather than assuming precision rendezvous becomes easy merely because guidance is good.
          ''',

              "Architecture-Free-Flight-and-Routing.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Sequential transfer between rotating tethers is not novel by itself. Kazanskii's 2026 *Space-Clock Elevator* numerically studies multiple rotating tethers at different orbital radii connected by intermediate elliptical free-flight nodes, with payloads transferred sequentially through the system. [Space-Clock Elevator](https://arxiv.org/abs/2604.11221)

          HASTOL also relies on a ballistic vehicle trajectory into a timed tether rendezvous rather than permanent attachment from launch onward. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          SpaceDonkey's target is narrower: use **many overlapping capture/release envelopes** so free flight becomes a routing resource, including alternate catches and recoverable misses, rather than merely a prescribed transfer arc between a small number of nodes.
          ''',

              "Architecture-Power-and-Energy.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Reusable tether systems have long separated the high-power transfer event from slower facility recharge. NASA's MXER concept gives orbital energy to a payload during momentum exchange and proposes rebuilding the facility state through electrodynamic reboost without propellant. [MXER design concept](https://ntrs.nasa.gov/citations/20060005548) [A Model for Dynamic Simulation and Analysis of Tether Momentum Exchange](https://ntrs.nasa.gov/citations/20020046691)

          *Sling-on-a-Ring* likewise treats the ring as infrastructure for momentum and electrical-power storage and includes solar-power hardware. [Meulenberg & Poston 2011](https://doi.org/10.1016/j.phpro.2011.08.021)

          SpaceDonkey borrows the reusable-infrastructure logic while leaving the exact power source, storage technology, and recharge cadence open to engineering trade study.
          ''',

              "Architecture-Angular-Momentum.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          The angular-momentum accounting is standard momentum-exchange-tether physics, not a SpaceDonkey discovery. NASA describes MXER as a momentum-exchange facility that imparts velocity to a payload at the expense of its own orbital state, followed by reboost between transfers. [NASA MXER model](https://ntrs.nasa.gov/citations/20020046691)

          HASTOL's baseline HEFT facility similarly included a conducting tether element for restoring facility momentum through interaction with Earth's magnetic field. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          SpaceDonkey's open question is how this bookkeeping closes **for a dense planetary network**: Earth coupling, electrodynamic reboost, regenerative inbound traffic, reaction mass, or some combination must ultimately pay the angular-momentum bill.
          ''',

              "Architecture-Control-and-Timing.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Precision timing is not speculative overhead. NASA's MXER simulation work studies a roughly 100 km spinning tether with a 6–7 minute period and notes that payload capture near perigee occurs within a window of only a few seconds; the study targeted tip-position prediction errors on the order of one meter. [MXER Simulation Study](https://ntrs.nasa.gov/citations/20060051892)

          NASA's broader MXER development program therefore included high-accuracy propagator/predictor software alongside catch mechanisms, tether materials, and electrodynamic systems. [MXER status, 2006](https://ntrs.nasa.gov/citations/20060047739)

          HASTOL likewise performed detailed rendezvous and capture simulation because tether-tip state and vehicle state must match within a narrow envelope. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          SpaceDonkey's control hypothesis is not that timing stops mattering; it is that **more stages and larger state-space overlap may make precision failure less catastrophic.**
          ''',

              "Architecture-Atmosphere-and-Terminals.md": r'''
          ## Prior art
          <!-- prior-art-citations-v1 -->

          Atmospheric pickup by rotating tether has already been studied aggressively. HASTOL's Phase II architecture used a hypersonic aircraft on a suborbital trajectory to meet a rotating tether tip at high altitude; the report explicitly trades rendezvous altitude, vehicle speed, aerodynamic drag, heating, and acceleration constraints. [HASTOL Phase II Final Report](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)

          *Sling-on-a-Ring* proposed rotating slings roughly 600 km long that descend from an orbital ring to about 13 km altitude for aircraft pickup, with split-second release/capture timing. [Meulenberg & Poston 2011](https://doi.org/10.1016/j.phpro.2011.08.021)

          SpaceDonkey therefore does **not** assume the first Donkey should begin at sea level. The lower terminal is an optimization problem: conventional launch, aircraft, hypersonic first stage, high-altitude platform, or another bridge to the first safe capture corridor may be better.
          ''',

              "Architecture-Borrowed-Technology.md": r'''
          ## Prior-art map
          <!-- prior-art-citations-v1 -->

          SpaceDonkey is intentionally an integration project. The correct question is not "did anyone ever imagine a ring or tether?" but **which demonstrated or seriously analyzed capability can we inherit without inheriting assumptions that do not survive our architecture?**

          | Capability we want | Prior art | What we borrow | What remains open |
          |---|---|---|---|
          | Planetary ring + Earth-stationary stations | [Birch, *Orbital Ring Systems and Jacob's Ladders — I* (1982)](https://nss.org/wp-content/uploads/Orbital-Rings.pdf) | Ring-scale infrastructure, ring stations/skyhooks, separation between moving support and stationary utility structure | Which support architecture best satisfies the SpaceDonkey backbone contract |
          | Vehicle-to-rotating-tether rendezvous | [Boeing/TUI HASTOL Phase II (2001)](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf) | Velocity-matched capture, grapple dynamics, atmospheric/terminal trades | Whether many smaller transfers can widen operational margins |
          | Reusable momentum-exchange tether | [NASA MXER design concept](https://ntrs.nasa.gov/citations/20060005548) | Catch/release, high-specific-strength tether, reusable facility, electrodynamic reboost | Stage geometry and recharge scheme for a dense network |
          | Precision tether dynamics | [NASA MXER Simulation Study](https://ntrs.nasa.gov/citations/20060051892) | High-fidelity propagation and the empirical seriousness of second-scale capture windows | Whether overlap/redundancy can turn precision from a single point of failure into a routable constraint |
          | Ring with rotating sling modules | [Meulenberg & Poston, *Sling-on-a-Ring* (2011)](https://doi.org/10.1016/j.phpro.2011.08.021) | Direct ring+sling integration, energy/momentum storage, atmospheric pickup concept | High stage count, independent powered stages, graceful routing |
          | Multi-purpose circumterrestrial ring infrastructure | [Meulenberg & Balaji, *LEO Archipelago*](https://arxiv.org/abs/1009.4043) | Rings as reusable planetary infrastructure rather than one-purpose vehicles | SpaceDonkey's particular transport network and backbone contract |
          | Multiple sequential rotating tethers + free-flight nodes | [Kazanskii, *Space-Clock Elevator* (2026)](https://arxiv.org/abs/2604.11221) | Sequential multi-tether transfer and free-flight handoffs | Very high stage count as a deliberate trade for grace, recovery, route diversity, and bounded local loads |

          ### What we are **not** claiming

          We are not claiming invention of orbital rings, ring stations, skyhooks, rotating tethers, momentum exchange, electrodynamic reboost, atmospheric tether rendezvous, ring-mounted slings, or sequential multi-tether transport.

          ### What we are testing

          The narrower SpaceDonkey hypothesis is:

          > **Can a planetary backbone carrying many independently powered momentum-exchange stages create enough reachable-state overlap, capture grace, redundancy, and recoverability that Earth-to-orbit becomes a network-routing problem rather than one heroic launch or one heroic tether encounter?**

          If prior art already solves a subsystem better, we should use it. If an inherited assumption is false, we should delete it.
          ''',

              "Prior-Art.md": r'''
          ## Architecture citation map
          <!-- prior-art-citations-v1 -->

          The architecture handbook now cites prior art at the point where each mechanism enters the design. Core anchors:

          1. Paul Birch, *Orbital Ring Systems and Jacob's Ladders — I*, JBIS 35 (1982), 475–497. [PDF](https://nss.org/wp-content/uploads/Orbital-Rings.pdf)
          2. Boeing / Tethers Unlimited, *Hypersonic Airplane Space Tether Orbital Launch (HASTOL) Architecture Study, Phase II Final Report* (2001). [NIAC PDF](https://www.niac.usra.edu/files/studies/final_report/391Grant.pdf)
          3. Canfield et al., *A Model for Dynamic Simulation and Analysis of Tether Momentum Exchange* (2002). [NASA NTRS](https://ntrs.nasa.gov/citations/20020046691)
          4. McCandless et al., *Design Concept for a Reusable/Propellantless MXER Tether Space Transportation System*. [NASA NTRS](https://ntrs.nasa.gov/citations/20060005548)
          5. Levin, *MXER Simulation Study (Appendix A)* (2006). [NASA NTRS](https://ntrs.nasa.gov/citations/20060051892)
          6. Bonometti et al., *2006 Status of the Momentum eXchange Electrodynamic Re-Boost (MXER) Tether Development*. [NASA NTRS](https://ntrs.nasa.gov/citations/20060047739)
          7. Meulenberg & Balaji, *The LEO Archipelago* (2010). [arXiv:1009.4043](https://arxiv.org/abs/1009.4043)
          8. Meulenberg & Poston, *Sling-on-a-Ring: Structure for an elevator to LEO*, Physics Procedia 20 (2011), 222–231. [DOI](https://doi.org/10.1016/j.phpro.2011.08.021)
          9. Maksim A. Kazanskii, *Space-Clock Elevator: Multi-Stage Orbital Transport via Rotating Tethers and Elliptical Nodes* (2026). [arXiv:2604.11221](https://arxiv.org/abs/2604.11221)

          The purpose of this list is defensive clarity, not novelty theater: SpaceDonkey should **borrow everything it can and discard whatever does not remain true under its own architecture.**
          ''',
          }

          for name, addition in additions.items():
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Missing expected wiki page: {name}")
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  continue
              path.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Architecture citations already present"
            exit 0
          fi
          git commit -m "Cite prior art throughout architecture"
          git push origin HEAD
