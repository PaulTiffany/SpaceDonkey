name: Import SpaceDonkey hero

on:
  push:
    branches: [main]
    paths:
      - '.blob-staging/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and wire hero asset
        shell: bash
        run: |
          set -euo pipefail
          cat .blob-staging/part-*.txt | base64 -d > assets/donkey-this-ass-to-space.webp
          echo '42355fbaa5576e10b396bf0076bc8bb8f5bd3d3076290c6ea16cc02ea5a496b8  assets/donkey-this-ass-to-space.webp' | sha256sum -c -
          cat > README.md <<'EOF'
          <a href="https://github.com/PaulTiffany/SpaceDonkey/wiki">
            <img src="assets/donkey-this-ass-to-space.webp" alt="Donkey This Ass To Space" width="100%">
          </a>
          EOF
          rm -f .blob-staging/part-*.txt .blob-staging/READY assets/donkey-this-ass-to-space.webp.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serve generated SpaceDonkey hero [skip ci]'
          git push
