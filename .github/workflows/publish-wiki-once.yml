name: Publish SpaceDonkey wiki once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-wiki-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed wiki source
        uses: actions/checkout@v4

      - name: Push pages to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d wiki

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          tmp="$(mktemp -d)"

          git clone "$remote" "$tmp/wiki"
          find "$tmp/wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wiki/. "$tmp/wiki/"

          cd "$tmp/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi

          git commit -m "Publish SpaceDonkey wiki"
          git push origin HEAD
