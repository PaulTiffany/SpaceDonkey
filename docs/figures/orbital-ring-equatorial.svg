<text x="32" y="46" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9FB0C8">Planet radius 6,371 km &#183; ring altitude 300 km &#183; altitude exaggerated 9.2&#215;</text>
