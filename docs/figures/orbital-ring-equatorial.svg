<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img">
<title>Equatorial orbital ring schematic</title>
<desc>A planet viewed down the polar axis, encircled by a stationary ring in low orbit. Tethers hang from the ring to equatorial ground anchors. An inner dashed circle marks the mass stream that supports the ring. Ring altitude is exaggerated for legibility.</desc>
